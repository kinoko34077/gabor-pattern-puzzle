<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#171e31" />
<meta name="description" content="色と模様の移り変わりを眺めながら遊ぶ、画面いっぱいのガボールパズル。" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>ガボールパターンパズル</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:row;background:#171e31}
[hidden]{display:none!important}
#stage{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden}
#game{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
#game:focus-visible{outline:3px solid #b4dfff;outline-offset:-3px}
#hud{position:absolute;left:12px;top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:14px;background:rgba(18,26,46,.82);color:#fff;box-shadow:0 3px 14px #1113;backdrop-filter:blur(8px);pointer-events:none;font-size:14px}
#hud strong{font-size:17px;font-variant-numeric:tabular-nums}
#time-progress{height:7px;width:95px;accent-color:#ffab76}
#toolbar{flex:0 0 84px;background:#171e31;color:#fff;display:flex;flex-direction:column;align-items:stretch;justify-content:space-evenly;gap:3px;padding:6px;border-left:1px solid #40475b}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border:0;border-radius:13px;background:transparent;color:#f0f4ff;cursor:pointer;font:inherit}
.tool:hover,.tool:focus-visible{background:#2d3858;outline:2px solid #5e87bb}
.tool .glyph{font-size:26px;line-height:1.05}.tool .label{font-size:11px}
#ready-message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(13px,2vw,19px);white-space:nowrap;border-radius:20px;background:rgba(20,28,44,.8);color:#fff;padding:10px 20px;pointer-events:none}
#finished{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.end-panel{pointer-events:auto;display:grid;gap:10px;justify-items:center;background:rgba(20,28,44,.9);color:white;border-radius:22px;padding:26px 42px;box-shadow:0 8px 40px #1116;backdrop-filter:blur(7px)}
.end-panel h2{margin:0;font-size:21px}.end-panel strong{font-size:52px;font-variant-numeric:tabular-nums}
.end-panel button,.primary{border:0;border-radius:12px;background:#85cabc;color:#11231f;padding:11px 20px;font-weight:750;cursor:pointer}
dialog{max-width:min(94vw,460px);width:430px;max-height:87dvh;overflow:auto;border:1px solid #61718a;border-radius:20px;padding:0;background:#f8faff;color:#15243a;box-shadow:0 18px 60px #101a2880}
dialog::backdrop{background:rgba(10,17,34,.58);backdrop-filter:blur(5px)}
.settings-content{padding:23px;display:grid;gap:15px}
.settings-content h2{margin:0 0 5px;font-size:22px}
.settings-content label{display:grid;gap:7px;font-size:14px;font-weight:650}
.settings-content select,.settings-content input[type=color]{width:100%;height:41px;border:1px solid #bec9d8;border-radius:9px;background:#fff;color:#13243b}
.settings-content input[type=color]{padding:3px;cursor:pointer}
.settings-content input[type=range]{width:100%;accent-color:#245c81}
.settings-content .inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings-content .inline button{min-height:38px;border:1px solid #bdc6d2;background:#fff;color:#13243b;border-radius:9px;cursor:pointer}
.settings-content .title-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.settings-content .hint{font-size:12px;font-weight:400;color:#526176;line-height:1.5;margin:0}
@media (orientation:portrait){
 body{flex-direction:column}
 #toolbar{flex:0 0 auto;min-height:calc(65px + env(safe-area-inset-bottom));flex-direction:row;border-left:0;border-top:1px solid #40475b;padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
 .tool{flex:1;min-width:0;min-height:55px}
 #hud{top:max(7px,env(safe-area-inset-top));left:7px;font-size:12px;gap:6px;padding:5px 9px}
 #hud strong{font-size:14px}#time-progress{width:56px}
 #ready-message{font-size:14px}
}
@media (max-height:400px) and (orientation:landscape){
 #toolbar{flex-basis:68px;padding:3px}.tool{min-height:43px}.tool .glyph{font-size:20px}
 #hud{padding:4px 8px}
}
</style></head>
<body>
<main id="stage" aria-label="ガボール模様のパズル盤面">
  <canvas id="game" aria-label="ガボール模様を三つそろえる盤面"></canvas>
  <div id="hud" aria-live="off"><span>得点 <strong id="score">0</strong></span><span>残り <strong id="clock">60.0秒</strong></span><progress id="time-progress" max="60" value="60" aria-label="残り時間"></progress></div>
  <div id="ready-message">模様をドラッグして開始</div>
  <div id="finished" hidden><section class="end-panel"><h2>ゲーム終了</h2><strong id="final-score">0</strong><span>最高記録 <span id="best-score">0</span></span><button id="restart-button" type="button">もう一度遊ぶ</button></section></div>
</main>
<nav id="toolbar" aria-label="ゲーム操作">
  <button id="settings-button" class="tool" type="button" title="設定" aria-label="設定"><span class="glyph">⚙</span><span class="label">設定</span></button>
  <button id="mode-button" class="tool" type="button" title="表示モード" aria-label="表示モード"><span class="glyph">◉</span><span class="label">表示</span></button>
  <button id="palette-button" class="tool" type="button" title="色を入れ替える" aria-label="配色を入れ替える"><span class="glyph">◌</span><span class="label">配色</span></button>
  <button id="hint-button" class="tool" type="button" title="ヒント（時間消費）" aria-label="ヒント（残り時間を消費）"><span class="glyph">✦</span><span class="label">ヒント</span></button>
</nav>
<dialog id="settings" aria-labelledby="settings-heading"><section class="settings-content">
  <div class="title-row"><h2 id="settings-heading">ゲーム設定</h2><button id="close-settings" class="primary" type="button">閉じる</button></div>
  <label>ゲーム時間<select id="duration"><option value="30">30秒</option><option value="60">60秒</option><option value="90">90秒</option><option value="120">120秒</option><option value="180">180秒</option></select></label>
  <p class="hint">プレイ中の時間変更は次のゲームから反映します。設定を開いている間はゲーム時間が止まりますが、模様は変化し続けます。</p>
  <label>ガボールのデザイン<select id="theme"></select></label>
  <button id="random-palette" class="primary" type="button">七種類の配色を入れ替える</button>
  <div class="inline">
    <label>背景色<input id="background" type="color" value="#f1f3f6" /></label>
    <label>ガボール単色<input id="patch" type="color" value="#49bfae" /></label>
  </div>
  <button id="reset-background" class="primary" type="button">テーマの背景色に戻す</button>
  <label>模様の密度 <span id="density-value">6</span><input id="density" type="range" min="4" max="10" step="1" value="6" /></label>
  <label>模様の動く速さ <span id="speed-value">1.00倍</span><input id="speed" type="range" min="0.25" max="2" step="0.25" value="1" /></label>
  <p class="hint">色は模様の種類ごとに固定され、同じ種類を見分けられます。画面の向きや大きさに合わせて模様の数とサイズを調整します。</p>
</section></dialog>
<script type="module" src="./dist/main.js"></script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
 window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(console.warn));
}
</script>
</body></html>
