<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#858585" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>Gabor Pattern Puzzle</title>
<style>
  :root{color-scheme:light}
  html,body{height:100%;margin:0;background:#fff;overscroll-behavior:none}
  body{display:grid;place-items:start center;overflow:hidden}
  canvas#game{display:block;box-sizing:border-box;width:min(960px,100vw,calc(100dvh * 16 / 9));height:auto;aspect-ratio:16/9;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
  canvas#game:focus-visible{outline:1px solid #bbb}
  @media (orientation:portrait) and (max-width:700px){
    body{display:block;position:relative}
    canvas#game{position:absolute;top:50%;left:50%;width:min(100dvh,calc(100vw * 16 / 9));height:auto;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}
  }
</style>
</head><body>
<canvas id="game" aria-label="ガボール・マッチ3パズル"></canvas>
<script type="module" src="./dist/main.js"></script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./service-worker.js', {scope:'./'}).catch(console.warn); });
}
</script>
</body></html>
