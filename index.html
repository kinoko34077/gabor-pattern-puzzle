<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#171e31" />
<meta name="description" content="色と模様の移り変わりを眺めながら遊ぶ、画面いっぱいのガボールパズル。" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>ガボールパターンパズル</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:row;background:#808080}
[hidden]{display:none!important}
#stage{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden}
#game{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
#game:focus-visible{outline:2px solid #7caad0;outline-offset:-2px}
/* 横画面は右側の縦操作欄。縦画面では時計回り90°の位置関係で下端へ配置する。 */
#toolbar{position:relative;flex:0 0 clamp(56px,8.333vw,80px);
  min-height:0;background:#808080;color:#ededed;user-select:none}
.tool{position:absolute;left:0;width:100%;height:clamp(28px,7.8dvh,52px);
  display:grid;place-items:center;border:0;border-radius:8px;
  padding:2px;background:transparent;color:inherit;cursor:pointer;
  transform:translateY(-50%)}
.tool:hover,.tool:focus-visible{background:rgba(100,115,140,.22);outline:2px solid currentColor;outline-offset:-2px}
.tool:active{transform:translateY(-50%) scale(.94)}
.tool svg{width:clamp(21px,3.4vw,36px);height:clamp(21px,3.4vw,36px);
  stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#settings-button{top:6.5%}
#mode-button{top:14.8%}
#palette-button{top:30.5%}
#plus-button{top:46.3%}
#minus-button{top:62%}
#hint-button{top:77.8%}
#score{position:absolute;left:0;top:92.5%;transform:translateY(-50%);
  width:100%;text-align:center;font-size:clamp(15px,2.4vw,27px);font-weight:700;
  font-variant-numeric:tabular-nums;color:inherit;line-height:1.1;overflow:hidden}
#theme-toast{position:absolute;top:49%;right:10px;transform:translateY(-50%);
  background:rgba(31,42,60,.86);color:#fff;border-radius:12px;
  padding:8px 13px;font-size:14px;white-space:nowrap;
  pointer-events:none;box-shadow:0 3px 12px #1113;z-index:2}
#finished{position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(110,110,110,.91);color:#fff;z-index:3}
.end-panel{display:grid;justify-items:center;gap:17px;text-align:center;padding:20px}
.end-panel h2{margin:0;font-size:clamp(18px,3vw,26px);font-weight:500}
.end-panel strong{font-size:clamp(44px,8vw,72px);font-variant-numeric:tabular-nums}
.end-panel button{border:2px solid currentColor;border-radius:2px;background:transparent;color:inherit;
  font:inherit;padding:13px 30px;cursor:pointer}
.end-panel button:focus-visible{outline:3px solid #86c4e0}
#clock{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);
  white-space:nowrap}
dialog{max-width:min(94vw,460px);width:430px;max-height:87dvh;overflow:auto;
  border:1px solid #61718a;border-radius:20px;padding:0;background:#f8faff;
  color:#15243a;box-shadow:0 18px 60px #101a2880}
dialog::backdrop{background:rgba(10,17,34,.58);backdrop-filter:blur(5px)}
.settings-content{padding:23px;display:grid;gap:15px}
.settings-content h2{margin:0 0 5px;font-size:22px}
.settings-content label{display:grid;gap:7px;font-size:14px;font-weight:650}
.settings-content select,.settings-content input[type=color]{width:100%;height:41px;
  border:1px solid #bec9d8;border-radius:9px;background:#fff;color:#13243b}
.settings-content input[type=color]{padding:3px;cursor:pointer}
.settings-content input[type=range]{width:100%;accent-color:#245c81}
.settings-content .inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings-content .inline button{min-height:38px;border:1px solid #bdc6d2;
  background:#fff;color:#13243b;border-radius:9px;cursor:pointer}
.settings-content .title-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.settings-content .hint{font-size:12px;font-weight:400;color:#526176;line-height:1.5;margin:0}
.primary{border:0;border-radius:12px;background:#85cabc;color:#11231f;padding:11px 20px;font-weight:750;cursor:pointer}
@media (max-height:430px){
  .tool{height:clamp(24px,8dvh,34px)}
  .tool svg{width:clamp(21px,3vw,29px);height:clamp(21px,3vw,29px)}
  #score{font-size:21px}
}
@media (orientation:portrait){
  /* 90°はツール配置の座標関係だけを示す。内容物は正立したままにする。 */
  body{flex-direction:column}
  #stage{width:100%;height:auto;min-height:0}
  #toolbar{flex:0 0 calc(clamp(56px,14vw,76px) + env(safe-area-inset-bottom));
    width:100%;height:auto;min-height:0;padding-bottom:env(safe-area-inset-bottom);
    display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
  #toolbar .tool{position:relative;top:auto;left:auto;width:100%;height:100%;grid-row:1;
    transform:none;display:grid;place-items:center;padding:3px}
  #toolbar .tool:active{transform:scale(.94)}
  #toolbar #settings-button{grid-column:7}
  #toolbar #mode-button{grid-column:6}
  #toolbar #palette-button{grid-column:5}
  #toolbar #plus-button{grid-column:4}
  #toolbar #minus-button{grid-column:3}
  #toolbar #hint-button{grid-column:2}
  #toolbar #score{grid-column:1;grid-row:1;position:relative;top:auto;left:auto;
    width:100%;height:100%;max-width:none;overflow:visible;white-space:nowrap;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(12px,3.4vw,20px);transform:none}
  .tool svg{width:clamp(23px,8vw,31px);height:clamp(23px,8vw,31px)}
  #theme-toast{top:50%;left:50%;right:auto;
    transform:translate(-50%,-50%);max-width:calc(100% - 20px);
    white-space:normal;text-align:center}
  .end-panel{max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow:auto}
  dialog{width:min(94vw,430px);max-width:94vw;max-height:calc(100dvh - 24px)}
  .settings-content{padding:16px;gap:12px}
}
</style></head>

<body>
<main id="stage" aria-label="ガボール模様のパズル盤面">
  <canvas id="game" aria-label="ガボール模様を三つそろえる盤面"></canvas>
  <span id="clock" aria-live="off">60.0秒</span>
  <output id="theme-toast" role="status" aria-live="polite" hidden></output>
  <div id="finished" hidden><section class="end-panel">
    <h2>ゲーム終了</h2><strong id="final-score">0</strong>
    <span>最高記録 <span id="best-score">0</span></span>
    <button id="restart-button" type="button">もう一度</button>
  </section></div>
</main>
<nav id="toolbar" aria-label="ゲーム操作">
  <button id="settings-button" class="tool" type="button" title="設定" aria-label="設定">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="8"/><circle cx="20" cy="20" r="2.4"/><path d="M20 3v6M20 31v6M3 20h6M31 20h6M8 8l4 4M28 28l4 4M32 8l-4 4M12 28l-4 4"/></svg>
  </button>
  <button id="mode-button" class="tool" type="button" title="表示モード" aria-label="表示モード">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <path d="M7 7v26 M14 7c-4 4 4 8 0 13s4 9 0 13 M21 7c4 4-4 8 0 13s-4 9 0 13 M28 7c-4 4 4 8 0 13s4 9 0 13 M35 7v26"/>
    </svg>
  </button>
  <button id="palette-button" class="tool" type="button" title="デザインを切り替える" aria-label="配色を切り替える">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <g transform="translate(20 17) rotate(45)"><rect x="-11" y="-8" width="22" height="19" rx="1.5"/><path d="M-9-13h18v5h-18z M-7 8h14"/></g>
      <path d="M13 30c-3 4-3 6 0 7 3 0 3-3 0-7z"/>
    </svg>
  </button>
  <button id="plus-button" class="tool" type="button" title="模様を大きく" aria-label="模様を大きく（密度を下げる）">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><path d="M11 20h18M20 11v18" stroke-width="3"/></svg>
  </button>
  <button id="minus-button" class="tool" type="button" title="模様を小さく" aria-label="模様を小さく（密度を上げる）">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><path d="M11 20h18" stroke-width="3"/></svg>
  </button>
  <button id="hint-button" class="tool" type="button" title="ヒント（時間消費）" aria-label="ヒント（残り時間を消費）">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M13 23c-8-12 3-21 7-21s15 9 7 21l-3 3v6h-8v-6z"/><path d="M16 35h8M18 38h4M5 15H2M35 15h3M6 4l4 4M34 4l-4 4"/></svg>
  </button>
  <output id="score" aria-label="得点" aria-live="off"><span id="score-value">0</span></output>
</nav>
<dialog id="settings" aria-labelledby="settings-heading"><section class="settings-content">
  <div class="title-row"><h2 id="settings-heading">ゲーム設定</h2><button id="close-settings" class="primary" type="button">閉じる</button></div>
  <label>ゲーム時間<select id="duration"><option value="30">30秒</option><option value="60">60秒</option><option value="90">90秒</option><option value="120">120秒</option><option value="180">180秒</option></select></label>
  <p class="hint">プレイ中の時間変更は次のゲームから反映します。設定を開いている間はゲーム時間が止まりますが、模様は変化し続けます。</p>
  <label>ガボールのデザイン<select id="theme"></select></label>
  <button id="random-palette" class="primary" type="button">次のデザインに切り替える</button>
  <div class="inline">
    <label>背景色<input id="background" type="color" value="#f1f3f6" /></label>
    <label>ガボール単色<input id="patch" type="color" value="#49bfae" /></label>
  </div>
  <button id="reset-background" class="primary" type="button">テーマの背景色に戻す</button>
  <label>模様の密度 <span id="density-value">6</span><input id="density" type="range" min="4" max="10" step="1" value="6" /></label>
  <label>模様の動く速さ <span id="speed-value">1.00倍</span><input id="speed" type="range" min="0.25" max="2" step="0.25" value="1" /></label>
  <p class="hint">デザインは操作欄の配色ボタンでも順番に切り替えられます。画面の向きや大きさに合わせて模様の数とサイズを調整します。</p>
</section></dialog>
<script type="module" src="./dist/main.js"></script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
 window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(console.warn));
}
</script>
</body></html>
